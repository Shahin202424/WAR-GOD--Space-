<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c0721"/>
      <stop offset="40%" stop-color="#2c1126"/>
      <stop offset="75%" stop-color="#803320"/>
      <stop offset="100%" stop-color="#b84e1b"/>
    </linearGradient>
    <linearGradient id="dune1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8f2d18"/>
      <stop offset="100%" stop-color="#59180c"/>
    </linearGradient>
    <linearGradient id="dune2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b03d21"/>
      <stop offset="100%" stop-color="#8c2e17"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <!-- Distant Stars -->
  <circle cx="120" cy="50" r="1.5" fill="#fff" opacity="0.8"/>
  <circle cx="280" cy="80" r="2" fill="#fff" opacity="0.9"/>
  <circle cx="450" cy="40" r="1.2" fill="#fff" opacity="0.7"/>
  <circle cx="680" cy="70" r="2" fill="#fff" opacity="0.9"/>
  <circle cx="720" cy="120" r="1.5" fill="#fff" opacity="0.8"/>
  <!-- Mars Blue Sunset Sun -->
  <circle cx="650" cy="180" r="22" fill="#ffffff" filter="drop-shadow(0 0 16px #66d9ef)"/>
  <!-- Distant Mountain Ridge -->
  <path d="M0,320 Q200,240 400,310 T800,290 L800,500 L0,500 Z" fill="url(#dune1)"/>
  <!-- Foreground Rolling Dunes -->
  <path d="M0,380 Q250,330 500,390 T800,370 L800,500 L0,500 Z" fill="url(#dune2)"/>
  <rect x="0" y="440" width="800" height="60" fill="#7a2512"/>
</svg>

